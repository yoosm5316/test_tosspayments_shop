<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패 | FITROOM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-result="fail">
  <header class="header header--simple">
    <div class="wrap header__row">
      <a class="logo" href="index.html">FITROOM</a>
    </div>
  </header>

  <main class="wrap">
    <section class="result result--fail">
      <div class="result__icon" aria-hidden="true">!</div>
      <h1>결제를 완료하지 못했습니다</h1>
      <p class="result__desc" id="rMessage">결제가 완료되지 않았습니다.</p>

      <dl>
        <dt>에러 코드</dt><dd id="rCode">-</dd>
        <dt>주문번호</dt><dd id="rOrderId">-</dd>
      </dl>

      <div class="result__actions">
        <a class="btn btn--white" href="index.html">쇼핑 계속하기</a>
        <a class="btn btn--black" href="checkout.html">다시 결제하기</a>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
