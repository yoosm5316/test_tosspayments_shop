<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 완료 | FITROOM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-result="success">
  <header class="header header--simple">
    <div class="wrap header__row">
      <a class="logo" href="index.html">FITROOM</a>
      <ol class="steps">
        <li>장바구니</li>
        <li>주문서</li>
        <li class="is-on">주문 완료</li>
      </ol>
    </div>
  </header>

  <main class="wrap">
    <section class="result">
      <div class="result__icon" aria-hidden="true">✓</div>
      <h1>결제가 완료되었습니다</h1>
      <p class="result__desc">주문해 주셔서 감사합니다.</p>
      <p class="result__status" id="rStatus" role="alert"></p>

      <dl>
        <dt>주문번호</dt><dd id="rOrderId">-</dd>
        <dt>주문 상품</dt><dd id="rOrderName">-</dd>
        <dt>결제 금액</dt><dd id="rAmount">-</dd>
        <dt>결제 유형</dt><dd id="rType">-</dd>
        <dt>paymentKey</dt><dd id="rKey">-</dd>
      </dl>

      <p class="result__note">
        테스트 환경에서는 결제 인증까지만 진행됩니다. 실제 서비스에서는 이 페이지에 도착한 뒤 서버에서
        결제 승인 API를 호출해야 주문이 확정됩니다.
      </p>

      <div class="result__actions">
        <a class="btn btn--white" href="pants.html">바지 보러 가기</a>
        <a class="btn btn--black" href="index.html">쇼핑 계속하기</a>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
